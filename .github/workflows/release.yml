# Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN required.
# Configure once on npmjs.com → veclite → Settings → Trusted publishing:
#   Provider: GitHub Actions
#   Repository: thealpha93/VecLite
#   Workflow filename: release.yml
#   Allowed actions: npm publish
# https://docs.npmjs.com/trusted-publishers
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for OIDC trusted publishing

jobs:
  build-and-publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm (trusted publishing requires npm ≥ 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test && npm run test:rust

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
