[package]
name = "veclite"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables explicit SIMD intrinsics (core::arch::wasm32) for cosine_similarity.
# Requires --target wasm32-unknown-unknown; scalar fallback is used on other targets.
simd = []

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hnsw = "0.11"
space = "0.17"
rand_pcg = "0.3"
rand_core = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
